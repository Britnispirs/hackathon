services:
  app:
    build: .
    image: voice-assistant:latest
    container_name: voice-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./tests:/app/tests
